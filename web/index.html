<!DOCTYPE html>
<html lang="az">
<head>
  <!-- Replaced at build time by `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Heirloom crafts from the villages of Azerbaijan — verified by experts, shipped from Baku.">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="format-detection" content="telephone=no">

  <!-- iOS: "Add to Home Screen" launches this as a full-screen app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Export Hub">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Cultural Export Hub</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; overscroll-behavior: none; }
    body { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    /* Brand splash until Flutter paints its first frame. */
    #splash {
      position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: #0E5A57; transition: opacity .3s ease-out;
    }
    #splash svg { width: 96px; height: 96px; }
    #splash .bar { width: 120px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.22); overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #D9A232;
      animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
      <path d="M48 14 L82 48 L48 82 L14 48 Z" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
      <path d="M48 36 L60 48 L48 60 L36 48 Z" fill="#D9A232"/>
    </svg>
    <div class="bar"><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 320);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
